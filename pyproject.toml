[project]
name = "paperclip-blueprints"
version = "0.1.0a1"
description = "Generate deployable Paperclip company bundles from a structured Markdown brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Grolea-HQ" }]
dependencies = [
    "typer>=0.12",
    "anthropic==0.105.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
]

[project.scripts]
blueprints = "paperclip_blueprints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # ruff is pinned exactly: the formatter is not stable across versions, so a bump can
    # reformat already-merged files mid-session. Keep in sync with .pre-commit-config.yaml.
    "ruff==0.15.15",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperclip_blueprints"]

[tool.ruff]
# Pinned exactly (matches the `ruff==` dev-dep and the pre-commit rev): ruff refuses to run
# under a different version, so a bump can't silently reformat already-merged files. Bump all
# three together.
required-version = "==0.15.15"
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiom puts Option()/Argument() calls in argument defaults.
"**/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: makes a real Anthropic API call (skipped unless --integration is passed)",
]
